# AISERVICE Ingress & Service - ezenitac.duckdns.org HTTPS (Let's Encrypt)
# Traefik ACME를 통해 Let's Encrypt 인증서를 자동 관리하고 aiservice-gateway(8080)로 라우팅합니다.
#
# 적용: kubectl apply -f ddns/ingress-ezenitac.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: default
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: gateway-svc
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.127.2
    ports:
      - name: http
        port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ezenitac-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
        - ezenitac.duckdns.org
  rules:
    - host: ezenitac.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-svc
                port:
                  number: 80
