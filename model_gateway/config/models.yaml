# ==============================================================================
# AISERVICE Model Gateway Model Declarations (SSOT)
# ==============================================================================
hardware_profile: dev-rtx3060
vram_safety_limit_mb: 11264
max_gpu_concurrent_slots: 1

models:
  qwen3.5-9b:
    role: synthesis_llm
    port: 8089
    alias: [synthesis, default]
    filename: qwen3.5-9b.gguf
    n_ctx: 32768
    vram_mb: 6348
    n_gpu_layers: 99

  qwen3.5-4b:
    role: router_llm
    port: 8088
    alias: [fast, router]
    filename: qwen3.5-4b.gguf
    n_ctx: 8192
    vram_mb: 2764
    n_gpu_layers: 99

  bge-m3:
    role: embedding
    port: 8090
    alias: [embedding]
    filename: bge-m3.gguf
    n_ctx: 2048
    vram_mb: 1200
    n_gpu_layers: 99

  bge-reranker-v2-m3:
    role: rerank
    port: 8091
    alias: [rerank]
    filename: bge-reranker-v2-m3.gguf
    n_ctx: 2048
    vram_mb: 800
    n_gpu_layers: 99
