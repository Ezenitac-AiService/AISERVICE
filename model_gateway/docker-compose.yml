services:
  vllm-serv:
    build:
      context: .
      dockerfile: Dockerfile
    image: vllm-serv:latest
    container_name: vllm-serv-gateway
    command: ["bash", "-c", "python3 -m src.api.server < /dev/null"]
    init: true
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ./models:/app/models
      - ./config:/app/config
      - ./data:/app/data
      - ./src:/app/src
      - ./scripts:/app/scripts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - PYTHONPATH=/app:/app/.venv/lib/python3.12/site-packages
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
    networks:
      - aiservice-network

networks:
  aiservice-network:
    name: aiservice-network
    external: true
