[project]
name = "vllm-serv"
version = "0.1.0"
description = "vLLM Model Serving and Configuration Dashboard Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "huggingface-hub>=1.25.1",
    "pydantic>=2.13.4",
    "sse-starlette>=3.4.6",
    "uvicorn>=0.51.0",
    "llama-cpp-python[server]>=0.3.0",
    "cmake>=3.28",
    "ninja>=1.11",
    "scikit-build-core>=0.10.0",
    "openai>=2.50.0",
    "rank-bm25>=0.2.2",
    "kiwipiepy>=0.23.2",
    "python-dotenv>=1.2.2",
    "pytest-playwright>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


