networks:
  aiservice-network:
    name: aiservice-network
    driver: bridge

volumes:
  bteam_mysql_data:
    external: true
    name: bteam_bteam_mysql_data
  ateam_db_data:
    name: ateam_db_data
  redis_data:
    name: aiservice_redis_data

services:

  # ============================================================================
  # 0. 통합 AI 포털 정적 웹서버 (Nginx Unprivileged - aiservice-portal)
  # ============================================================================
  aiservice-portal:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: aiservice-portal
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - ../dist_node_a/portal_nginx.conf:/etc/nginx/nginx.conf:ro
      - ../dist_node_a/portal_static:/usr/share/nginx/html:ro
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    read_only: true
    tmpfs:
      - /tmp:size=8m
      - /var/run:size=4m
      - /var/cache/nginx:size=8m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # 1. 공통 LLM/임베딩 서빙 게이트웨이 (llama.cpp-CUDA - model-gateway)
  # ============================================================================
  model-gateway:
    build:
      context: ./model_gateway
      dockerfile: Dockerfile
    image: model-gateway:latest
    container_name: model-gateway
    command: ["bash", "-c", "python3 -m src.api.server < /dev/null"]
    init: true
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:8081:8081"
    shm_size: '2gb'
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./model_gateway/models:/app/models
      - ./model_gateway/config:/app/config
      - ./model_gateway/data:/app/data
      - ./model_gateway/src:/app/src
      - ./model_gateway/scripts:/app/scripts
      - ./model_gateway/tests:/app/tests
    stop_grace_period: 30s
    environment:
      - PYTHONPATH=/app:/app/.venv/lib/python3.12/site-packages
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
      - FAST_LLM_MODEL=${FAST_LLM_MODEL:-qwen3.5-4b}
      - SYNTHESIS_LLM_MODEL=${SYNTHESIS_LLM_MODEL:-qwen3.5-9b}
      - VRAM_SAFETY_LIMIT_MB=${VRAM_SAFETY_LIMIT_MB:-11264}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/health/readiness | grep -q 'ready' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - aiservice-network

  # ============================================================================
  # 1.1 공통 Redis 인메모리 캐시 & 세션/큐 인프라 (Redis 7 - aiservice-redis)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: aiservice-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "900", "1", "--save", "300", "10", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - aiservice-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # ============================================================================
  # 2. B-Team 공통 데이터베이스 (MySQL 8.0 - bteam_db)
  # ============================================================================
  bteam_db:
    image: mysql:8.0
    container_name: bteam_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=512M
      - --innodb_buffer_pool_size=1G
      - --innodb_log_file_size=256M
      - --innodb_flush_log_at_trx_commit=2
    environment:
      MYSQL_ROOT_PASSWORD: ${BTEAM_DB_ROOT_PASSWORD:?set BTEAM_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${BTEAM_DB_NAME:-oliview_project}
      MYSQL_USER: ${BTEAM_DB_USER:?set BTEAM_DB_USER}
      MYSQL_PASSWORD: ${BTEAM_DB_PASSWORD:?set BTEAM_DB_PASSWORD}
    volumes:
      - bteam_mysql_data:/var/lib/mysql
    networks:
      - aiservice-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # ============================================================================
  # 3. B-Team 메인 백엔드 API (Flask/Gunicorn - oliview_backend)
  # ============================================================================
  oliview_backend:
    build:
      context: ./bteam/Oliview_Project/backend
      dockerfile: Dockerfile
    image: oliview_backend:latest
    container_name: oliview_backend
    restart: unless-stopped
    environment:
      DB_HOST: bteam_db
      DB_PORT: 3306
      DB_USER: ${BTEAM_DB_USER:?set BTEAM_DB_USER}
      DB_PASSWORD: ${BTEAM_DB_PASSWORD:?set BTEAM_DB_PASSWORD}
      DB_NAME: ${BTEAM_DB_NAME:-oliview_project}
      DB_NAME3: ${BTEAM_DB_NAME:-oliview_project}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      bteam_db:
        condition: service_healthy
    volumes:
      - ./bteam/Oliview_Project/backend:/app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - aiservice-network

  # ============================================================================
  # 4. B-Team 메인 프론트엔드 UI (React Vite - oliview_frontend)
  # ============================================================================
  oliview_frontend:
    build:
      context: ./bteam/Oliview_Project/frontend
      dockerfile: Dockerfile
    image: oliview_frontend:latest
    container_name: oliview_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:5173"
    environment:
      VITE_BACKEND_URL: http://oliview_backend:5050
      DOCKER_CONTAINER: "true"
    depends_on:
      - oliview_backend
    volumes:
      - ./bteam/Oliview_Project/frontend:/app
      - /app/node_modules
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - aiservice-network

  # ============================================================================
  # 5. B-Team 올리챗 (FastAPI - oliview_chatbot_a)
  # ============================================================================
  oliview_chatbot_a:
    build:
      context: ./bteam/Oliview_chatbot_a
      dockerfile: Dockerfile
    image: oliview_chatbot_a:latest
    container_name: oliview_chatbot_a
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8501"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8501"]
    environment:
      PYTHONPATH: /app:/app/bteam:/bteam
      DB_HOST: bteam_db
      DB_PORT: 3306
      DB_USER: ${BTEAM_DB_USER:?set BTEAM_DB_USER}
      DB_PASSWORD: ${BTEAM_DB_PASSWORD:?set BTEAM_DB_PASSWORD}
      DB_NAME: ${BTEAM_DB_NAME:-oliview_project}
      SERVER_HOST: http://model-gateway
      MAIN_PORT: 8081
      EMBED_PORT: 8081
      EMBEDDING_PORT: 8081
      RERANK_PORT: 8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FAST_LLM_MODEL: ${FAST_LLM_MODEL:-qwen3.5-4b}
      SYNTHESIS_LLM_MODEL: ${SYNTHESIS_LLM_MODEL:-qwen3.5-9b}
      USE_LLM_METADATA_FILTER: "false"
    volumes:
      - ./bteam/Oliview_chatbot_a:/app
      - ./bteam/oliview_core:/app/oliview_core
    depends_on:
      bteam_db:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - aiservice-network

  # ============================================================================
  # 6. B-Team 올원챗 (FastAPI - oliview_chatbot_b)
  # ============================================================================
  oliview_chatbot_b:
    build:
      context: ./bteam/Oliview_chatbot_b
      dockerfile: Dockerfile
    image: oliview_chatbot_b:latest
    container_name: oliview_chatbot_b
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8002"
    environment:
      PYTHONPATH: /app:/app/bteam:/bteam
      DB_HOST: bteam_db
      DB_PORT: 3306
      DB_USER: ${BTEAM_DB_USER:?set BTEAM_DB_USER}
      DB_PASSWORD: ${BTEAM_DB_PASSWORD:?set BTEAM_DB_PASSWORD}
      DB_NAME: ${BTEAM_DB_NAME:-oliview_project}
      SERVER_HOST: http://model-gateway
      MAIN_PORT: 8081
      EMBED_PORT: 8081
      EMBEDDING_PORT: 8081
      RERANK_PORT: 8081
      FAST_LLM_MODEL: ${FAST_LLM_MODEL:-qwen3.5-4b}
      SYNTHESIS_LLM_MODEL: ${SYNTHESIS_LLM_MODEL:-qwen3.5-9b}
    volumes:
      - ./bteam/Oliview_chatbot_b:/app
      - ./bteam/oliview_core:/app/oliview_core
    depends_on:
      bteam_db:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - aiservice-network

  # ============================================================================
  # 7. A-Team 데이터베이스 (MySQL 8.0 - pilos-db)
  # ============================================================================
  pilos_db:
    image: mysql:8.0
    container_name: pilos-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=512M
      - --innodb_buffer_pool_size=1G
      - --innodb_log_file_size=256M
      - --innodb_flush_log_at_trx_commit=2
    environment:
      MYSQL_ROOT_PASSWORD: ${PILOS_DB_ROOT_PASSWORD:?set PILOS_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PILOS_DB_NAME:-pilos_v2}
      MYSQL_USER: ${PILOS_DB_USER:?set PILOS_DB_USER}
      MYSQL_PASSWORD: ${PILOS_DB_PASSWORD:?set PILOS_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ateam_db_data:/var/lib/mysql
    networks:
      - aiservice-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 300s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # ============================================================================
  # 8. A-Team 메인 웹 & 대시보드 (Flask/Gunicorn - pilos-web)
  # ============================================================================
  pilos_web:
    build:
      context: ./ateam/pilos-sentiment-index
      dockerfile: Dockerfile
    image: pilos-web:latest
    container_name: pilos-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:5000"
    environment:
      DB_HOST: pilos-db
      DB_PORT: 3306
      DB_USER: ${PILOS_DB_USER:?set PILOS_DB_USER}
      DB_PASSWORD: ${PILOS_DB_PASSWORD:?set PILOS_DB_PASSWORD}
      DB_NAME: ${PILOS_DB_NAME:-pilos_v2}
      LLM_PROVIDER: openai
      LLM_API_KEY: EMPTY
      LLM_BASE_URL: http://model-gateway:8081/v1
      EMBEDDING_BASE_URL: http://model-gateway:8081/v1
      EMBEDDING_API_KEY: EMPTY
      EMBEDDING_MODEL: bge-m3
      RERANK_BASE_URL: http://model-gateway:8081/v1
      RERANK_API_KEY: EMPTY
      RERANK_MODEL: bge-reranker-v2-m3
      CHAT_LLM_MODEL: ${SYNTHESIS_LLM_MODEL:-qwen3.5-9b}
      REPORT_LLM_MODEL: ${FAST_LLM_MODEL:-qwen3.5-4b}
      REPORT_LLM_OUTPUT_MODE: ${REPORT_LLM_OUTPUT_MODE:-json_object}
      SERVICE_KNOWLEDGE_VERSION: "1.0"
      EMBEDDING_TIMEOUT_SECONDS: "300"
      RERANK_TIMEOUT_SECONDS: "300"
      CHAT_LLM_TIMEOUT_SECONDS: "300"
      REPORT_LLM_TIMEOUT_SECONDS: "300"
      FAST_LLM_MODEL: ${FAST_LLM_MODEL:-qwen3.5-4b}
      SYNTHESIS_LLM_MODEL: ${SYNTHESIS_LLM_MODEL:-qwen3.5-9b}
      KIWOOM_APP_KEY: ${KIWOOM_APP_KEY:-}
      KIWOOM_SECRET_KEY: ${KIWOOM_SECRET_KEY:-}
      KIWOOM_HOST: ${KIWOOM_HOST:-https://api.kiwoom.com}
      SUPPLY_DEMAND_DB_WRITE_ENABLED: ${SUPPLY_DEMAND_DB_WRITE_ENABLED:-true}
      FLASK_SECRET_KEY: ${FLASK_APP_SECRET:?set FLASK_APP_SECRET}
    volumes:
      - ./ateam/pilos-sentiment-index/pilos:/app/pilos
      - ./ateam/pilos-sentiment-index/tests:/app/tests
      - ./ateam/pilos-sentiment-index/artifacts:/app/artifacts
      - ./ateam/pilos-sentiment-index/data:/app/data
    depends_on:
      pilos_db:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - aiservice-network

  # ============================================================================
  # 9. A-Team 수집·분석 파이프라인 워커 (pilos-worker)
  # ============================================================================
  pilos_worker:
    build:
      context: ./ateam/pilos-sentiment-index
      dockerfile: Dockerfile
    image: pilos-web:latest
    container_name: pilos-worker
    command: ["python", "-m", "pilos.jobs.worker_daemon"]
    restart: unless-stopped
    environment:
      DB_HOST: pilos-db
      DB_PORT: 3306
      DB_USER: ${PILOS_DB_USER:-pilos_user}
      DB_PASSWORD: ${PILOS_DB_PASSWORD:?set PILOS_DB_PASSWORD}
      DB_NAME: ${PILOS_DB_NAME:-pilos_v2}
      LLM_PROVIDER: openai
      LLM_API_KEY: EMPTY
      LLM_BASE_URL: http://model-gateway:8081/v1
      EMBEDDING_BASE_URL: http://model-gateway:8081/v1
      EMBEDDING_API_KEY: EMPTY
      EMBEDDING_MODEL: bge-m3
      RERANK_BASE_URL: http://model-gateway:8081/v1
      RERANK_API_KEY: EMPTY
      RERANK_MODEL: bge-reranker-v2-m3
      CHAT_LLM_MODEL: ${SYNTHESIS_LLM_MODEL:-qwen3.5-9b}
      REPORT_LLM_MODEL: ${FAST_LLM_MODEL:-qwen3.5-4b}
      REPORT_LLM_OUTPUT_MODE: ${REPORT_LLM_OUTPUT_MODE:-json_object}
      SERVICE_KNOWLEDGE_VERSION: "1.0"
      PIPELINE_INTERVAL_SECONDS: ${PIPELINE_INTERVAL_SECONDS:-600}
      SECRET_SALT: ${SECRET_SALT:-${FLASK_APP_SECRET:?set FLASK_APP_SECRET}}
      SECRET_SALT2: ${SECRET_SALT2:-${FLASK_APP_SECRET:?set FLASK_APP_SECRET}}
      KIWOOM_APP_KEY: ${KIWOOM_APP_KEY:-}
      KIWOOM_SECRET_KEY: ${KIWOOM_SECRET_KEY:-}
      KIWOOM_HOST: ${KIWOOM_HOST:-https://api.kiwoom.com}
      SUPPLY_DEMAND_DB_WRITE_ENABLED: ${SUPPLY_DEMAND_DB_WRITE_ENABLED:-true}
    volumes:
      - ./ateam/pilos-sentiment-index/pilos:/app/pilos
      - ./ateam/pilos-sentiment-index/tests:/app/tests
      - ./ateam/pilos-sentiment-index/artifacts:/app/artifacts
      - ./ateam/pilos-sentiment-index/data:/app/data
    depends_on:
      pilos_db:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - aiservice-network

  # ============================================================================
  # 10. 최소 검증 프로브 컨테이너 (One-shot Probe - aiservice-probe)
  # ============================================================================
  aiservice-probe:
    image: python:3.12-slim
    container_name: aiservice-probe
    profiles: ["probe"]
    networks:
      - aiservice-network
    entrypoint: ["python3"]
