[project]
name = "oliview-pipelines"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "oliview-core",
    "numpy<2",
    "torch==2.2.2+cpu",
    "transformers>=4.45.0,<5",
]

[tool.uv.sources]
oliview-core = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
