[project]
name = "oliview-chatbot-a-green"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = ["oliview-core"]

[tool.uv.sources]
oliview-core = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

