[project]
name = "aspect-sentence-split"
version = "0.1.0"
description = "화장품 리뷰에서 속성별 원문 구절을 추출하는 토큰 분류 모델"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
]
