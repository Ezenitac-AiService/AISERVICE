# ==============================================================================
# Nginx Upstream Configuration: Blue Legacy Stack (Rollback Profile)
# ==============================================================================

upstream bteam_dashboard_backend {
    server 127.0.0.1:5050;
    keepalive 32;
}

upstream bteam_dashboard_ui {
    server 127.0.0.1:5173;
    keepalive 32;
}

upstream bteam_chatbot_a {
    server 127.0.0.1:8501;
    keepalive 32;
}

upstream bteam_chatbot_b {
    server 127.0.0.1:8002;
    keepalive 32;
}

# Proxy Next Upstream & Retry Policy
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 10s;

# Locations Mapping
location /bteam/oliview/api/ {
    proxy_pass http://bteam_dashboard_backend/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

location /bteam/oliview/ {
    proxy_pass http://bteam_dashboard_ui/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

location /bteam/chata/ {
    proxy_pass http://bteam_chatbot_a/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location /bteam/chatb/ {
    proxy_pass http://bteam_chatbot_b/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
