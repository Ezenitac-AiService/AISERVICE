# Candidate only. The active Blue gateway/nginx.conf is never edited by this file.
upstream bteam_green_dashboard_api { server 127.0.0.1:15050; }
upstream bteam_green_dashboard_ui { server 127.0.0.1:15173; }
upstream bteam_green_chata { server 127.0.0.1:18501; }
upstream bteam_green_chatb { server 127.0.0.1:18002; }

server {
  listen 127.0.0.1:18080;
  location /bteam/oliview/api/ { proxy_pass http://bteam_green_dashboard_api/; }
  location /bteam/oliview/ { proxy_pass http://bteam_green_dashboard_ui/; }
  location /bteam/chata/ { proxy_pass http://bteam_green_chata/; }
  location /bteam/chatb/ { proxy_pass http://bteam_green_chatb/; }
}

