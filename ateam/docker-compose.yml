services:
  db:
    container_name: pilos-db
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-pilos_v2}
      MYSQL_USER: ${DB_USER:-pilos_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ateam_db_data:/var/lib/mysql
    networks:
      - aiservice-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    container_name: pilos-web
    build:
      context: ./pilos-sentiment-index
      dockerfile: Dockerfile
    image: pilos-web:latest
    restart: unless-stopped
    env_file:
      - ./pilos-sentiment-index/.env
    environment:
      - LLM_BASE_URL=http://vllm-serv-gateway:8081/v1
      - FAST_LLM_MODEL=qwen3.5-2b
      - SYNTHESIS_LLM_MODEL=qwen3.5-4b
    volumes:
      - ./pilos-sentiment-index/artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aiservice-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/stocks', timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ateam_db_data:
    name: ateam_db_data

networks:
  aiservice-network:
    name: aiservice-network
    external: true
