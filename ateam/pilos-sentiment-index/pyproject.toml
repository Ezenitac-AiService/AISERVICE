[project]
name = "pilos-sentiment-index"
version = "0.1.0"
description = "Market sentiment analysis project using stock community comments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "langchain-text-splitters>=1.1.2",
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
    "flask>=3.1.3",
    "kiwipiepy>=0.23.2",
    "numpy>=2.4.2",
    "pandas>=3.0.5",
    "pydantic>=2.0.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.0",
    "sqlalchemy>=2.0.51",
    "redis>=5.0.0",
]

[tool.uv]
package = false
