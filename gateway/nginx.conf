worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # WebSocket Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Structured JSON Access Log Format with Request ID and Latency Tracing
    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Global Max Body Size (for datasets & image uploads)
    client_max_body_size 100M;

    # Gzip Compression (Bypassing text/event-stream for SSE)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost ezenitac.duckdns.org 1.250.5.161;

        # Standard Proxy Headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        port_in_redirect off;

        # ====================================================================
        # 1. Root Path - Unified Portal Landing Page
        # ====================================================================
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ====================================================================
        # 2. B-Team Oliview Backend API (/bteam/oliview/api/)
        # ====================================================================
        location /bteam/oliview/api/ {
            proxy_pass http://oliview_backend:5050/api/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # CORS Headers
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # ====================================================================
        # 3. B-Team Oliview Main Frontend (/bteam/oliview/)
        # ====================================================================
        location /bteam/oliview/ {
            proxy_pass http://oliview_frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Sub-route alias for root-less navigation
        location = /bteam/oliview {
            return 301 /bteam/oliview/;
        }

        # ====================================================================
        # 4. B-Team Oliview Chatbot A (올리챗 Streamlit /bteam/chata/)
        # ====================================================================
        location /bteam/chata/ {
            proxy_pass http://oliview_chatbot_a:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /bteam/chata {
            return 301 /bteam/chata/;
        }

        # ====================================================================
        # 5. B-Team Oliview Chatbot B (올원챗 FastAPI /bteam/chatb/)
        # ====================================================================
        location /bteam/chatb/ {
            proxy_pass http://oliview_chatbot_b:8002/;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Prefix /bteam/chatb;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /bteam/chatb {
            return 301 /bteam/chatb/;
        }

        # ====================================================================
        # 6. A-Team Pilos Main Web Dashboard (/ateam/pilos/)
        # ====================================================================
        location /ateam/pilos/ {
            proxy_pass http://pilos-web:5000/;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Prefix /ateam/pilos;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /ateam/pilos {
            return 301 /ateam/pilos/;
        }

        # ====================================================================
        # Error Pages
        # ====================================================================
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
