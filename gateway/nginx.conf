worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # WebSocket Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Scheme detection with reverse proxy support
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Structured JSON Access Log Format with Request ID and Latency Tracing
    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Docker Embedded DNS Server
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Global Max Body Size
    client_max_body_size 100M;

    # Rate Limiting & Anonymous AI Request Throttling (FR-008a, 10 req/min, 2 concurrent)
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=ai_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Trusted Proxy & Real Client IP Detection
    set_real_ip_from 127.0.0.1/32;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        # 5 Local Gateway Alias Ports matching Reverse Tunnel
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 3000;
        listen [::]:3000;
        listen 8001;
        listen [::]:8001;
        listen 8002;
        listen [::]:8002;
        listen 8003;
        listen [::]:8003;
        listen 8004;
        listen [::]:8004;
        server_name _;

        # Standard Proxy Headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        port_in_redirect off;

        # 1. Root Path - Unified Portal Landing Page
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Canonical Changelog Data JSON
        location = /changelog_data.json {
            root /usr/share/nginx/html;
            try_files /changelog_data.json =404;
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Canonical Changelog Path
        location /changelog {
            root /usr/share/nginx/html;
            try_files /changelog.html =404;
            default_type text/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # 2. B-Team Oliview Backend API
        location ^~ /bteam/oliview/api/ {
            proxy_pass http://oliview_backend:5050/api/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # 3. B-Team Oliview Main Frontend
        location /bteam/oliview/ {
            proxy_pass http://oliview_frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /bteam/oliview {
            return 301 /bteam/oliview/;
        }

        # 4. B-Team Oliview Chatbot A (with rate limiting & body limit)
        location /bteam/chata/ {
            proxy_pass http://oliview_chatbot_a:8501/;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Prefix /bteam/chata;
            proxy_buffering off;
            proxy_cache off;
            client_max_body_size 64k;
            limit_req zone=ai_limit burst=2 nodelay;
            limit_conn ai_conn 2;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location = /bteam/chata {
            return 301 /bteam/chata/;
        }

        # 5. B-Team Oliview Chatbot B (with rate limiting & body limit)
        location /bteam/chatb/ {
            proxy_pass http://oliview_chatbot_b:8002/;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Prefix /bteam/chatb;
            proxy_buffering off;
            proxy_cache off;
            client_max_body_size 64k;
            limit_req zone=ai_limit burst=2 nodelay;
            limit_conn ai_conn 2;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location = /bteam/chatb {
            return 301 /bteam/chatb/;
        }

        # 6. A-Team Pilos Main Web Dashboard
        location /ateam/pilos/ {
            proxy_pass http://pilos_web:5000/;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Prefix /ateam/pilos;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /ateam/pilos {
            return 301 /ateam/pilos/;
        }

        # Pilos Frontend /api/ direct proxy
        location /api/ {
            proxy_pass http://pilos_web:5000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Pilos Frontend /stocks/ direct proxy
        location /stocks/ {
            proxy_pass http://pilos_web:5000/stocks/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /stocks {
            return 301 /stocks/;
        }

        # Pilos Frontend /about direct proxy
        location /about {
            proxy_pass http://pilos_web:5000/about;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Static Assets Direct Proxy
        location /static/ {
            proxy_pass http://pilos_web:5000/static/;
            proxy_http_version 1.1;
            proxy_buffering on;
            add_header Cache-Control "public, max-age=86400" always;
            expires 1d;
        }

        # Error Pages
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
