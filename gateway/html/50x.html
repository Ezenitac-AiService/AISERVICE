<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>50x Service Unavailable | AISERVICE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .container {
      max-width: 520px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.8rem; color: #f8fafc; }
    p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      border-radius: 0.6rem;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .btn:hover { background: #4f46e5; }
    .status-code {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">⚠️</div>
    <h1>서비스 일시 준비 중</h1>
    <p>
      요청하신 AI 서비스 백엔드가 초기화 중이거나 일시적으로 응답할 수 없습니다.<br>
      잠시 후 다시 시도해 주시기 바랍니다.
    </p>
    <a href="/" class="btn">통합 포털로 돌아가기</a>
    <div class="status-code">HTTP 502 / 503 / 504 Gateway Error</div>
  </div>
</body>
</html>
